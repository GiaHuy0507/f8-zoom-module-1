<!doctype html>
<html lang="en">
  <head>
    <title>Contact</title>
    <%- include("./partials/head.ejs")%>
  </head>
  <body>
    <div class="wrapper">
      <div class="header-wrapper">
        <!-- header -->
        <%- include("./partials/header.ejs") %>
      </div>

      <!-- end header-wrapper -->

      <!-- main content -->
      <main>
        <section class="contact">
          <div class="container">
            <div class="row">
              <div class="col-6 col-md-8">
                <div class="contact__content">
                  <h4 class="contact__subtitle subtitle subtitle--gray">
                    Contact Us
                  </h4>
                  <h1 class="contact__title title title--dark">
                    We Are Always Ready To Hear For You.
                  </h1>
                  <p class="desc desc--gray">
                    The right move at the right time saves your investment. live
                    the dream of expanding your business.
                  </p>
                </div>
              </div>
            </div>

            <section class="contact-form">
              <div class="container">
                <div class="row">
                  <!-- Name -->
                  <div class="col-6 col-md-12">
                    <div class="form-group">
                      <input type="text" placeholder="Enter your name" />
                    </div>
                  </div>

                  <!-- Company -->
                  <div class="col-6 col-md-12">
                    <div class="form-group">
                      <input type="text" placeholder="Company (optional)" />
                    </div>
                  </div>

                  <!-- Email -->
                  <div class="col-6 col-md-12">
                    <div class="form-group">
                      <input type="email" placeholder="Your email" />
                    </div>
                  </div>

                  <!-- Phone -->
                  <div class="col-6 col-md-12">
                    <div class="form-group">
                      <input type="tel" placeholder="Phone number" />
                    </div>
                  </div>

                  <!-- Message -->
                  <div class="col-12">
                    <div class="form-group">
                      <textarea placeholder="Tell us about yourself"></textarea>
                    </div>
                  </div>

                  <!-- Button -->
                  <div class="col-12">
                    <button class="contact-form__btn">Contact us</button>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </section>
      </main>

      <!-- footer -->
      <%- include("./partials/footer.ejs") %>
    </div>
  </body>
  <script type="module" src="./main.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</html>
